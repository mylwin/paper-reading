# 论文 skills 共享配置
#
# 面向 paper-reading 论文工作区（目录规范见工作区 .AGENT.md）：
#   01-raw/YYYY-MM/            原始 PDF        <- paper-daily 落盘（按入库月份分层）
#   02-markdown/YYYY-MM/       PDF 解析结果     <- 用户流程（按入库月份分层）
#   03-notes/YYYY-MM/<标题>/   精读笔记         <- 用户流程（按入库月份分层）
#   04-equation_problem/<标题>/  公式推理       <- sgd-paper-reading 产出（不月份化）
#   06-translation/YYYY-MM/<标题>/  翻译产物    <- 用户流程（按入库月份分层）
#   07-research/               周期调研报告     <- paper-weekly
#   08-daily/<日期>/           每日检索日报     <- paper-daily / paper-conf
#   08-reading/<标题>/         精读过程材料     <- paper-sgd-reading（不月份化）
#
# 月份口径：论文首次进入 01-raw 的日期所在月；同一篇论文在四个阶段月份与主干必须一致。
# 三个 skill 共用这一份；改研究主题请用 paper-interests，不要手改。

language: zh

# --- 月份分层与索引（见工作区 .AGENT.md）---
layout:
  # 按 YYYY-MM/ 分层的目录（其余目录只按论文标题建目录）
  month_dirs:
    - "01-raw"
    - "02-markdown"
    - "03-notes"
    - "06-translation"
  month_pattern: "YYYY-MM"
  readme_name: "README.md"
  index_name: "index.md"
  # 索引/月份 README 中由脚本维护的表格区间
  index_markers:
    - "<!-- INDEX:BEGIN -->"
    - "<!-- INDEX:END -->"

# 解析结果（02-markdown）中允许本地化的远程图片主机
# （见 02-markdown/README.md 与 localize_markdown_images.py）
image_localize_hosts:
  - "cdn-mineru.openxlab.org.cn"

# 论文工作区根目录；留空时自动识别当前项目根目录。
# 也可用 PAPER_WORKSPACE_PATH 或命令行 --workspace 临时覆盖。
workspace_path: ""

# --- workspace 内目录（相对 workspace）---
papers_dir: "01-raw"          # 原始 PDF 落盘 + 已存在论文扫描
markdown_dir: "02-markdown"   # 解析结果（用户负责生成）
notes_dir: "03-notes"         # 论文精读笔记目录
equation_dir: "04-equation_problem"  # AI 公式推理定稿（周报只读骨架与疑问）
translation_dir: "06-translation"    # 翻译产物（周报只标注存在性）
reading_dir: "08-reading"     # AI 思考过程与问答记录（周报只读；不给人当教材）
daily_dir: "08-daily"         # 每日检索日报，按 日期/ 隔离
research_dir: "07-research"   # paper-weekly 周期报告

# 每日检索时的目录与文件名
daily_note_name: "今日检索"    # -> 08-daily/<日期>/今日检索.md
daily_index_name: "_index.json"
daily_result_name: "search_result.json"

# --- 数据源（paper-daily）---
#   arxiv       arXiv 预印本
#   openreview  OpenReview（ICLR/NeurIPS/ICML 等计算机顶会），无需 key
sources:
  - arxiv
  - openreview

# arXiv 分类：优化理论主战场（math.OC / stat.ML）+ 机器学习实现（cs.LG / cs.NA）
arxiv_categories:
  - math.OC
  - stat.ML
  - cs.LG
  - cs.NA
  - cs.AI

# --- 检索与推荐规模 ---
max_results: 200        # 每个数据源最多拉取多少篇
top_n: 10               # 最终推荐多少篇
days: 30                # 最近窗口天数（另一窗口为过去一年）
pdf_top_k: 3            # 前 K 篇下载 PDF 到 papers_dir

# 去重：推荐时排除知识库中已有的论文（01-raw / 03-notes / 08-daily 历史）
exclude_known: true
include_known_in_recommendations: false

# Semantic Scholar API Key（可选）。留空则匿名访问，可能遇到 429 限流。
semantic_scholar_api_key: ""

# arXiv 请求参数
arxiv_request_timeout: 120
arxiv_max_keywords: 0    # 0 = 保留全部关键词，由脚本按批次查询

# ===========================================================================
# paper-weekly：周期分析
# ===========================================================================
weekly:
  enabled: true
  interval_days: 7            # 距上次分析满 7 天才再次运行（从首次调用日起算）
  window_days: 7              # 每次分析读取最近 N 天内的新增素材
  start_date: ""              # 首次调用时由脚本自动写入，不要手改
  last_run: ""                # 上次成功运行的日期，由脚本维护
  history_size: 40            # 送入分析的论文数量上限
  # 周报文件名：<周起始日>-第N周周报.md（N 从 start_date 起算）
  note_pattern: "{week_start}-第{week_no}周周报.md"
  # 分析范围以研究主题为主、论文范围为辅（详见 paper-weekly/SKILL.md）
  theme_first: true
  # 是否用 git 提交记录判定"本周新增的论文"（比 mtime 可靠）
  use_git_history: true
  git_lookback_days: 30       # git 查询回看天数上限
  # --- 第一阶段（宏观）：先了解这一周研究主题的发展 ---
  # 按优先级读取；前面的先读、可以通读，后面的按需定点查证
  inputs:
    - "08-daily"              # 每日检索日报 + 题目清单：宏观全景，成本最低
    - "03-notes"              # 你自己的精读判断，信息密度最高
    - "02-markdown"           # 解析全文，只在查证公式/实验数字时定点读
  # --- 第二阶段（针对性）：找你不理解的地方，用于给出具体建议 ---
  # 每个目录的读取方式见 paper-weekly/SKILL.md 的 extract 约定
  context_dirs:
    - "04-equation_problem"   # extract=question_files_only：只读 *疑问*.md 与标题骨架，不读推导正文
    - "08-reading"            # extract=qa_log：读问答记录，判断卡点与掌握程度
    - "06-translation"        # extract=existence_only：只标注有没有翻译
  # 各 context 目录的读取模式：
  #   question_files_only  只读文件名含"疑问/问题/不懂"的文件 + 其余文件的标题骨架
  #   qa_log               读问答记录，判断卡点与掌握程度
  #   existence_only       只列文件名
  # 读取模式由脚本按目录名自动判定，此处仅作文档说明。

# ===========================================================================
# 研究领域：检索关键词来源。paper-interests skill 会修改这一段。
# priority 1-10，越大越优先（参与域选择加权）
#
# 真实研究定位（2026-09）：
#   理论主线 —— 随机梯度方法及其收敛性理论（SGD 变体、动量/加速、自适应学习率、
#               方差缩减、非凸与 PL 条件收敛分析）
#   应用侧重 —— 大模型训练优化，聚焦 7B 级别中小模型的训练框架调整与优化器创新
# ===========================================================================
research_domains:
  随机梯度与优化理论:
    keywords:
      # === 基础方法与变体 ===
      - stochastic gradient descent
      - SGD
      - stochastic optimization
      - stochastic approximation
      - mini-batch
      - variance reduction
      - SVRG
      - SAGA
      - SARAH
      - STORM
      # === 动量与加速 ===
      - momentum
      - heavy ball
      - Nesterov acceleration
      - accelerated gradient
      - gradient descent
      - clipped gradient
      - gradient clipping
      # === 自适应学习率 ===
      - adaptive learning rate
      - adaptive step size
      - Adam
      - AdaGrad
      - RMSProp
      - signSGD
      - normalized gradient
      - polyak step size
      - parameter-free
      # === 收敛性分析 ===
      - convergence rate
      - convergence analysis
      - nonconvex optimization
      - Polyak-Lojasiewicz
      - PL condition
      - strong convexity
      - smoothness
      - lower bound
      - regret bound
      # === 曲率与二阶信息 ===
      - curvature
      - preconditioning
      - Newton method
      - quasi-Newton
      - Hessian
      - second-order
      - steepest descent
      - lp-norm
    arxiv_categories:
      - math.OC
      - stat.ML
      - cs.LG
      - cs.NA
    priority: 5
    subdomains:
      随机梯度与收敛性:
        keywords:
          - stochastic gradient descent
          - SGD
          - stochastic optimization
          - stochastic approximation
          - mini-batch
          - variance reduction
          - SVRG
          - SAGA
          - SARAH
          - STORM
          - convergence rate
          - convergence analysis
          - nonconvex optimization
          - Polyak-Lojasiewicz
          - PL condition
          - strong convexity
          - smoothness
          - lower bound
          - regret bound
      动量、裁剪与加速:
        keywords:
          - momentum
          - heavy ball
          - Nesterov acceleration
          - accelerated gradient
          - gradient descent
          - clipped gradient
          - gradient clipping
      自适应与二阶优化:
        keywords:
          - adaptive learning rate
          - adaptive step size
          - Adam
          - AdaGrad
          - RMSProp
          - signSGD
          - normalized gradient
          - polyak step size
          - parameter-free
          - curvature
          - preconditioning
          - Newton method
          - quasi-Newton
          - Hessian
          - second-order
          - steepest descent
          - lp-norm

  大模型训练优化:
    keywords:
      # === 训练优化器（应用侧重）===
      - large language model training
      - LLM training
      - training optimization
      - optimizer design
      - optimizer
      - learning rate schedule
      - warmup
      - weight decay
      - batch size scaling
      - gradient noise scale
      # === 内存与效率 ===
      - memory-efficient training
      - memory-efficient optimizer
      - low-rank adaptation
      - LoRA
      - ZeRO
      - gradient checkpointing
      - activation memory
      - mixed precision training
      - 8-bit optimizer
      - quantized optimizer
      # === 分布式与稳定性 ===
      - distributed training
      - data parallelism
      - tensor parallelism
      - sharded optimizer
      - gradient compression
      - communication efficiency
      - training stability
      - loss spike
      - hyperparameter transfer
      - muP
      - scaling law
    arxiv_categories:
      - cs.LG
      - cs.CL
      - cs.DC
      - math.OC
    priority: 4
    subdomains:
      LoRA 与参数高效微调:
        keywords:
          - low-rank adaptation
          - LoRA
      优化器与训练策略:
        keywords:
          - large language model training
          - LLM training
          - training optimization
          - optimizer design
          - optimizer
          - learning rate schedule
          - warmup
          - weight decay
          - batch size scaling
          - gradient noise scale
          - hyperparameter transfer
          - muP
      内存与数值效率:
        keywords:
          - memory-efficient training
          - memory-efficient optimizer
          - ZeRO
          - gradient checkpointing
          - activation memory
          - mixed precision training
          - 8-bit optimizer
          - quantized optimizer
      分布式与通信效率:
        keywords:
          - distributed training
          - data parallelism
          - tensor parallelism
          - sharded optimizer
          - gradient compression
          - communication efficiency
      训练稳定性与缩放:
        keywords:
          - training stability
          - loss spike
          - scaling law

# 命中这些关键词的论文直接排除
excluded_keywords:
  - workshop
  - survey

# 关键词自动链接时额外忽略的词（可选）
# extra_common_words:
#   - convergence
